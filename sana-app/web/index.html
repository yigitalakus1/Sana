<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Laboratuvar sonuçları için yerel ve kaynaklı sağlık asistanı.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sana">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <!-- Marka işareti: nabız halkası. SVG destekleyen tarayıcılar bunu, eskiler
       favicon.png'yi kullanır. -->
  <link rel="icon" type="image/svg+xml" href="sana-mark.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sana</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Geliştirme sırasında uygulama `--pwa-strategy=none` ile derleniyor, ama daha
    önce bir kez kaydolmuş service worker tarayıcıda kalıcıdır: yeni derleme
    yapılsa bile eski dosyaları önbellekten servis etmeye devam eder ve uygulama
    "güncellenmiyor" görünür. Aşağıdaki blok kalan kaydı ve önbelleği temizler,
    sonra sayfayı bir kez yeniler.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        if (registrations.length === 0) return;
        Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        })).then(function () {
          if (!window.caches) return null;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) {
              return caches.delete(key);
            }));
          });
        }).then(function () {
          // Yalnız gerçekten kayıt bulunduğunda yenilenir; döngüye girmez.
          window.location.reload();
        });
      }).catch(function () {
        // Temizlik yapılamazsa uygulama yine de açılır.
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
